interface:
  display_name: "李晨式情感分析"
  short_description: "用李晨式家庭、欲望、五项情感能力与攻击性体系分析具体人"
  default_prompt: "使用 $lichen-love-skill 分析这个问题。先忠实调用李晨的中国式理论，把家庭训练、特异性心理需求、攻击性、现实收益，以及欲望、感知力、暧昧能力、激情能力、为人处事能力组成的情感能力链连起来；同时分析我为什么这样提问、希望AI证明或免除什么。允许根据有限线索先下主判断，再用一至三个高价值问题追到长期反复与家庭形成。若我是在兴奋分享一个具体异性，优先识别正常欲望、主动创造和事后生命力，不自动降温。操作从具体人和阶段中生成，不固定附加话术、退出或道德提醒。只有我明确要求评价时，才把李晨判断和你自己的看法分开输出。"

policy:
  allow_implicit_invocation: true
